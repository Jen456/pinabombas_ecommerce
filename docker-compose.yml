services:
  db:
    image: mariadb:10.6
    container_name: pinabombas_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
      - ./db/pinabombas.sql:/docker-entrypoint-initdb.d/pinabombas.sql:ro

  wordpress:
    image: wordpress:6.5-php8.1-apache
    container_name: pinabombas_wp
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:-wp}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_CONFIG_EXTRA: |
        @ini_set('upload_max_filesize','128M');
        @ini_set('post_max_size','128M');
        @ini_set('memory_limit','512M');
    volumes:
      - ./wordpress:/var/www/html

  wpcli:
    image: wordpress:cli-php8.1
    depends_on:
      - db
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:-wp}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
    volumes:
      - ./wordpress:/var/www/html
    user: "33:33"
    entrypoint: ["wp"]
    command: ["--info"]

volumes:
  dbdata:
